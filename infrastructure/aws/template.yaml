AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Frontend y backend serverless para normativa-precheck

Parameters:
  OpenAiApiKeyParameterName:
    Type: String
    Default: /normativa-precheck/openai-api-key
  VectorStoreIdParameterName:
    Type: String
    Default: /normativa-precheck/vector-store-id
  DomainName:
    Type: String
    Default: normativa-precheck.endrokosai.com
  HostedZoneId:
    Type: String
  CertificateArn:
    Type: String

Resources:
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - content-type
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - !Sub "https://${DomainName}"
            ExposedHeaders:
              - ETag
            MaxAge: 900
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadedProjects
            Prefix: uploads/
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireGeneratedReports
            Prefix: reports/
            Status: Enabled
            ExpirationInDays: 7

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        Description: Acceso privado de CloudFront al bucket del frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: Cabeceras de seguridad del frontend
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} frontend"
        Enabled: true
        Aliases:
          - !Ref DomainName
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref FrontendSecurityHeaders
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendDnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  FrontendDnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
                  - DistributionId: !Ref FrontendDistribution

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda
      Handler: src.endpoints.chat_lambda.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 180
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadRuntimeSettings
              Effect: Allow
              Action:
                - ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAiApiKeyParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${VectorStoreIdParameterName}"
            - Sid: DecryptRuntimeSettings
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}"
      Environment:
        Variables:
          OPENAI_API_KEY_PARAMETER: !Ref OpenAiApiKeyParameterName
          VECTOR_STORE_ID_PARAMETER: !Ref VectorStoreIdParameterName
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - !Sub "https://${DomainName}"
          AllowHeaders:
            - content-type
          AllowMethods:
            - POST
          MaxAge: 86400

  ReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda
      Handler: src.endpoints.review_lambda.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage:
        Size: 2048
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadProjectsAndWriteReports
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${FilesBucket.Arn}/*"
            - Sid: ReadRuntimeSettings
              Effect: Allow
              Action:
                - ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAiApiKeyParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${VectorStoreIdParameterName}"
            - Sid: DecryptRuntimeSettings
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}"
      Environment:
        Variables:
          FILES_BUCKET: !Ref FilesBucket
          OPENAI_API_KEY_PARAMETER: !Ref OpenAiApiKeyParameterName
          VECTOR_STORE_ID_PARAMETER: !Ref VectorStoreIdParameterName
          FONT_REGULAR_PATH: /var/task/fonts/DejaVuSans.ttf
          FONT_BOLD_PATH: /var/task/fonts/DejaVuSans-Bold.ttf
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - !Sub "https://${DomainName}"
          AllowHeaders:
            - content-type
          AllowMethods:
            - POST
          MaxAge: 86400

Outputs:
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FilesBucketName:
    Value: !Ref FilesBucket
  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Value: !Sub "https://${DomainName}"
  ChatFunctionUrl:
    Value: !GetAtt ChatFunctionUrl.FunctionUrl
  ReviewFunctionUrl:
    Value: !GetAtt ReviewFunctionUrl.FunctionUrl
